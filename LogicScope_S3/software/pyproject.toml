[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logicscope-s3"
version = "0.1.0"
description = "LogicScope S3 USB logic analyser desktop app and capture CLI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
logicscope = "logicscope.__main__:main"

[tool.setuptools.packages.find]
include = ["logicscope*"]
